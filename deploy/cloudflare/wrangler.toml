name = "alfred"
main = "worker.js"
compatibility_date = "2024-11-01"

# Cloudflare Workers AI — free, no external key. Add this binding to the Worker.
[ai]
binding = "AI"

# Conversation memory (KV). Create: npx wrangler kv namespace create MEMORY
# [[kv_namespaces]]
# binding = "MEMORY"
# id = "PASTE_THE_ID_WRANGLER_PRINTS"

# RAG knowledge base (Vectorize). Create:
#   npx wrangler vectorize create alfred-kb --dimensions=768 --metric=cosine
# [[vectorize]]
# binding = "VEC"
# index_name = "alfred-kb"

# Secrets (set these, don't put keys here):
#   npx wrangler secret put GROQ_API_KEY
# Optional var:
#   [vars]
#   LLM_MODEL = "llama-3.3-70b-versatile"
