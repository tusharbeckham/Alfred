name = "alfred"
main = "worker.js"
compatibility_date = "2024-11-01"

# Cloudflare Workers AI — free, no external key.
[ai]
binding = "AI"

# Conversation memory (KV).
[[kv_namespaces]]
binding = "MEMORY"
id = "f393a1bf08fc47a29c6181f06aaa324d"

# RAG knowledge base (Vectorize).
[[vectorize]]
binding = "VEC"
index_name = "alfred-kb"

# Secrets (set separately, never stored here):
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put ADMIN_KEY
